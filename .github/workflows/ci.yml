name: Verify AskGobi

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Use Node.js 24 LTS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Check migrations in isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/signal-db" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          PGLITE_MODULE="$RUNNER_TEMP/signal-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-signal-db.mjs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build production application
        run: npm run build
